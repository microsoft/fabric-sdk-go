# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: 🧪 Test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}-{2}-{3}-{4}', github.workflow, github.event_name, github.ref, github.base_ref || null, github.head_ref || null) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚧 Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🚧 Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: 🔨 Setup Test tools
        run: task test:tools

      - name: 🧪 Run fake tests
        run: task test

      - name: 📢 Publish test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: 📜 Test results
          reporter: jest-junit
          path: testresults.xml

      # Cobertura summary needs a coverage.xml translation layer (gocov-xml or
      # gocover-cobertura); disabled while using built-in Go coverage only.
      # - name: ⚙️ Get Coverage summary
      #   uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      #   with:
      #     filename: coverage.xml
      #     badge: true
      #     fail_below_min: false
      #     format: markdown
      #     hide_branch_rate: false
      #     hide_complexity: false
      #     indicators: true
      #     output: both
      #     thresholds: "40 60"

      # - name: 📢 Publish coverage results
      #   run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: testresults.xml
          if-no-files-found: warn
          overwrite: true

      - name: 📤 Upload coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-coverage-results
          path: |
            coverage.html
            coverage.out
            coverage.txt
          if-no-files-found: warn
          overwrite: true
